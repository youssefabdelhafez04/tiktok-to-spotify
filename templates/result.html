<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Export Ready</title>
    <style>
      :root {
        --bg: #f7f7f4;
        --text: #161616;
        --muted: #5f625f;
        --line: #d8d8d2;
        --panel: #ffffff;
        --accent: #0f7b6c;
        --accent-dark: #07594e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.45;
      }
      main {
        width: min(820px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(36px, 7vw, 64px);
        line-height: 0.98;
        letter-spacing: 0;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 18px;
      }
      .panel {
        margin-top: 26px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 22px;
      }
      .stat {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .stat strong {
        display: block;
        font-size: 28px;
      }
      .stat span {
        color: var(--muted);
        font-size: 14px;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }
      a.button:hover { background: var(--accent-dark); }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .links a:not(.button) {
        color: var(--accent-dark);
        font-weight: 700;
      }
      @media (max-width: 720px) {
        main { padding: 34px 0; }
        .panel { padding: 18px; }
        .stats { grid-template-columns: repeat(2, 1fr); }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your exports are ready.</h1>
      <p>Download the ZIP, then use Spotlistr, TuneMyMusic, or Spotify Desktop to create the playlist.</p>

      <div class="panel">
        <div class="stats">
          <div class="stat">
            <strong>{{ matched }}</strong>
            <span>Spotify matches</span>
          </div>
          <div class="stat">
            <strong>{{ title_only }}</strong>
            <span>Title-only exports</span>
          </div>
          <div class="stat">
            <strong>{{ unresolved }}</strong>
            <span>Skipped or missed</span>
          </div>
          <div class="stat">
            <strong>{{ total }}</strong>
            <span>Total sounds</span>
          </div>
        </div>

        <div class="links">
          <a class="button" href="/download/{{ job_id }}">Download ZIP</a>
          <a href="/">Convert another file</a>
        </div>
      </div>
    </main>
  </body>
</html>
